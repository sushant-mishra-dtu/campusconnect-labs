# One college lab node on its own machine, connecting out to the platform.
#   CRTL_SERVER=ws://<platform host>:4000/ws/node CRTL_NODE=<node id> CRTL_NODE_TOKEN=<token> \
#     docker compose -f labnode/compose.yaml up -d --build
# The node id and token come from the platform (Labs → Lend a board, or `admin token <node>`).
name: c-rtl-labnode

services:
  labnode:
    build:
      context: ..
      dockerfile: labnode/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      CRTL_SERVER: ${CRTL_SERVER:?set CRTL_SERVER to the platform, e.g. ws://<platform host>:4000/ws/node}
      CRTL_NODE: ${CRTL_NODE:?set CRTL_NODE to the node id the platform issued}
      CRTL_NODE_TOKEN: ${CRTL_NODE_TOKEN:?set CRTL_NODE_TOKEN to the node token}
      CRTL_MODE: ${CRTL_MODE:-sim}
      CRTL_SERIAL: ${CRTL_SERIAL:-}
      # The node's own dashboard, on http://<this machine>:4100
      CRTL_DASHBOARD_PORT: "4100"
    ports:
      - "${CRTL_DASHBOARD_HOST_PORT:-4100}:4100"
    volumes:
      - keys:/keys
    # hw mode: pass the ESP32 examiner and the iCEBreaker's USB through, then set CRTL_MODE=hw and
    # CRTL_SERIAL=/dev/ttyACM0. The ESP32's key must be enrolled on the platform first.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    #   - /dev/bus/usb:/dev/bus/usb

volumes:
  keys:
